    <style>
      .wd-staff-form {
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        box-shadow: 0 2px 10px rgba(15, 23, 42, 0.05);
        padding: 22px;
      }

      .wd-form-section {
        margin-bottom: 18px;
        padding: 16px;
        background: #f8fafc;
        border: 1px solid #e5e7eb;
        border-radius: 10px;
      }

      .wd-form-section:last-child {
        margin-bottom: 0;
      }

      .wd-section-title {
        margin: 0 0 14px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e5e7eb;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 17px;
        color: #0f172a;
      }

      .wd-section-title i {
        color: #00bc60;
      }

      .wd-form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }

      .wd-form-group {
        margin: 0;
      }

      .wd-form-label,
      .wd-form-group label {
        display: block;
        margin-bottom: 7px;
        font-size: 13px;
        color: #475569;
        font-weight: 600;
      }

      .wd-form-input,
      .wd-form-select {
        width: 100%;
        min-height: 40px;
        padding: 10px 12px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 14px;
        color: #0f172a;
        background: #fff;
      }

      .wd-form-input:focus,
      .wd-form-select:focus {
        outline: none;
        border-color: #00bc60;
        box-shadow: 0 0 0 3px rgba(0, 188, 96, 0.1);
      }

      .wd-phone-group {
        display: grid;
        grid-template-columns: 130px 1fr;
        gap: 8px;
      }

      .wd-inline-actions {
        margin-top: 10px;
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        flex-wrap: wrap;
      }

      /* أوقات الدوام — نفس تنسيق ساعات العمل (work-hours) */
      .wd-week-days {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        align-items: stretch;
      }

      .wd-day-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px;
        border: 1px solid #eee;
        border-radius: 8px;
        background: #f8f9fa;
        min-width: 0;
      }

      .wd-day-item.enabled {
        background: #fff;
        border-color: #2ecc71;
      }

      .wd-day-checkbox {
        width: 20px;
        height: 20px;
        cursor: pointer;
      }

      .wd-day-label {
        flex: 0 0 auto;
        font-weight: 500;
        color: #333;
        min-width: 4.5em;
      }

      .wd-day-time-inputs {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: 1;
        min-width: 0;
        justify-content: flex-end;
      }

      .wd-time-input-group {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .wd-time-input {
        padding: 8px 10px;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-size: 14px;
        width: 100%;
        min-width: 0;
        max-width: 110px;
      }

      .wd-time-separator {
        color: #666;
        font-weight: 500;
      }

      .wd-staff-schedule-subtitle {
        margin: 0 0 20px;
        color: #333;
        font-size: 16px;
        font-weight: 500;
      }

      .wd-permissions-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .wd-permission-box {
        border: 1px solid #dbe2ea;
        border-radius: 10px;
        padding: 12px;
        background: #fff;
      }

      .wd-permission-box-title {
        margin: 0 0 8px;
        font-size: 15px;
        color: #0f172a;
      }

      .wd-form-checkbox {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px;
        border-radius: 6px;
        cursor: pointer;
      }

      .wd-form-checkbox:hover {
        background: #f8fafc;
      }

      .wd-form-checkbox input[type="checkbox"] {
        width: 16px;
        height: 16px;
      }

      .wd-form-checkbox span {
        font-size: 13px;
        color: #334155;
      }

      .wd-form-actions {
        margin-top: 18px;
        padding-top: 14px;
        border-top: 1px solid #e5e7eb;
        display: flex;
        justify-content: flex-end;
        gap: 10px;
      }

      .wd-btn {
        min-height: 38px;
        padding: 8px 16px;
        border-radius: 8px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }

      .wd-btn-secondary {
        background: #fff;
        border: 1px solid #d1d5db;
        color: #334155;
      }

      .wd-btn-primary {
        background: #00bc60;
        border: 1px solid #00bc60;
        color: #fff;
      }

      @media (max-width: 900px) {
        .wd-form-grid,
        .wd-permissions-grid {
          grid-template-columns: 1fr;
        }

        .wd-phone-group {
          grid-template-columns: 1fr;
        }

        .wd-inline-actions .wd-btn {
          width: 100%;
        }

        .wd-day-item {
          flex-wrap: wrap;
        }

        .wd-day-time-inputs {
          width: 100%;
          margin-right: 0;
          justify-content: flex-start;
        }
      }

      @media (max-width: 640px) {
        .wd-week-days {
          grid-template-columns: 1fr;
        }
        .wd-content-body {
          padding: 12px;
        }

        .wd-staff-form {
          padding: 14px;
        }

        .wd-form-actions {
          flex-direction: column;
        }

        .wd-form-actions .wd-btn {
          width: 100%;
        }
      }
    </style>

    <script src="../script.js"></script>
    <script>
      function toggleStaffDay(day) {
        const checkbox = document.getElementById("staff-" + day);
        const dayItem = checkbox.closest(".wd-day-item");
        const fromInput = document.getElementById("staff-" + day + "-from");
        const toInput = document.getElementById("staff-" + day + "-to");
        if (checkbox.checked) {
          dayItem.classList.add("enabled");
          fromInput.disabled = false;
          toInput.disabled = false;
        } else {
          dayItem.classList.remove("enabled");
          fromInput.disabled = true;
          toInput.disabled = true;
        }
      }

      function getActivationLink() {
        return "https://apps.widers.net/activate/staff/demo-token";
      }

      function copyActivationLink() {
        const link = getActivationLink();
        navigator.clipboard.writeText(link).then(
          function () {
            alert("تم نسخ رابط التفعيل");
          },
          function () {
            alert("تعذر نسخ الرابط");
          }
        );
      }

      function sendActivationLink() {
        const link = getActivationLink();
        const email = (document.getElementById("email") || {}).value || "";
        const phoneCode = (document.getElementById("countryCode") || {}).value || "";
        const phone = (document.getElementById("phoneNumber") || {}).value || "";
        const target = email || `${phoneCode}${phone}`;
        alert(`تم إرسال رابط التفعيل إلى: ${target || "الموظف"}\n${link}`);
      }
